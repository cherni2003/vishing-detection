project:
  name: vishing-detection
  random_seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  features_dir: data/features
  metadata_dir: data/metadata
  models_dir: models
  reports_dir: reports

data:
  manifest_path: data/metadata/audio_manifest.csv
  catalog_path: data/metadata/datasets_catalog.csv
  # Table d'analyse (nombre de tours, hard_scam...). Sert à l'évaluation, jamais à l'entraînement.
  audit_features_path: data/metadata/vish_darija_audit_features.csv

outputs:
  quality: data/interim/quality.parquet
  manifest: data/processed/manifest.parquet
  segments: data/processed/segments.parquet
  handcrafted: data/features/handcrafted.parquet
  embeddings: data/features/embeddings.parquet
  model_dir: models/latest
  baselines: reports/baselines.json
  metrics: reports/metrics.json

training:
  test_size: 0.2
  validation_size: 0.1
  random_seed: 42
