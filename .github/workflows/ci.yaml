name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          pip install -e .
          pip install pandas"<3" numpy pyarrow pyspark librosa soundfile scipy scikit-learn joblib PyYAML pytest
      - name: Tests
        run: pytest -q
